plugins {
    id 'com.android.application'
}

android {
    namespace 'app.fanfilm4k'
    compileSdk 37

    defaultConfig {
        applicationId 'app.fanfilm4k'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'io.github.mlm-games:adblock:0.1.3'
}
