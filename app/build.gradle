plugins {
    id 'com.android.application'
}

android {
    namespace 'app.fanfilm4k'
    compileSdk 34

    defaultConfig {
        applicationId 'app.fanfilm4k'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party dependencies: plain android.app.Activity + android.webkit.WebView.
